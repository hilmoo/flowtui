version: "3"

tasks:
  build:
    desc: Build the flowtui binary into ./bin
    cmds:
      - go build -o bin/flowtui{{exeExt}} ./cmd/flowtui
  run:
    desc: Run flowtui against the sample project
    dir: testdata/sample
    cmds:
      - go run ../../cmd/flowtui
  test:
    desc: Run all tests
    cmds:
      - go test ./...
  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...
